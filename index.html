    // --- APLICACIÓN PRINCIPAL ---
    function App() {
      const [currentRoute, setCurrentRoute] = useState("/");

      const navigate = (path) => {
        setCurrentRoute(path);
        window.scrollTo(0, 0);
      };

      const renderRoute = () => {
        if (currentRoute === "/") return <HomePage navigate={navigate} />;
        if (currentRoute === "/nosotros") return <NosotrosPage />;
        if (currentRoute === "/servicios") return <ServiciosPage />;
        if (currentRoute === "/proyectos") return <ProyectosPage navigate={navigate} />;
        if (currentRoute.startsWith("/proyectos/")) {
          const slug = currentRoute.replace("/proyectos/", "");
          return <ProyectoDetallePage slug={slug} navigate={navigate} />;
        }
        if (currentRoute === "/contacto") return <ContactoPage navigate={navigate} />;
        if (currentRoute === "/trabaja-con-nosotros") return <TrabajaConNosotrosPage />;
        if (currentRoute === "/privacidad") return <div className="pt-48 pb-32 text-center font-prompt text-sm font-light">Política de Privacidad</div>;
        if (currentRoute === "/aviso-legal") return <div className="pt-48 pb-32 text-center font-prompt text-sm font-light">Aviso Legal</div>;
        if (currentRoute === "/cookies") return <div className="pt-48 pb-32 text-center font-prompt text-sm font-light">Política de Cookies</div>;
        return <HomePage navigate={navigate} />;
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-white selection:bg-neutral-100 selection:text-black">
          <Header currentRoute={currentRoute} navigate={navigate} />
          {renderRoute()}
          <Footer navigate={navigate} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
